<style>

/* =========================================================
   HOT GENES — CHAT PROJECT
   Y2K / 2000s DIGITAL WEBSITE
   ========================================================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    background:#000;
    color:#000;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================================================
   FUNDO
   ========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            rgba(255,255,255,.72),
            rgba(255,255,255,.72)
        ),
        url("fundo.jpg");

    background-size:cover;
    background-position:center;

    z-index:-2;
}

/* =========================================================
   SITE
   ========================================================= */

.site{
    width:min(1180px,96%);
    margin:15px auto 40px;

    background:rgba(255,255,255,.94);

    border:3px solid #000;

    box-shadow:
        0 0 0 5px #fff,
        0 0 0 8px #000,
        0 15px 40px rgba(0,0,0,.5);
}

/* =========================================================
   HEADER
   ========================================================= */

header{
    background:#000;
    color:#fff;

    border-bottom:3px solid #fff;
}

.header-inner{
    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:20px;
}

.header-logo{
    width:190px;
    max-width:40%;
}

.header-logo img{
    width:100%;
    display:block;
}

/* =========================================================
   MENU
   ========================================================= */

nav{
    display:grid;

    grid-template-columns:
        repeat(9,1fr);

    gap:4px;

    padding:7px;

    background:#111;

    border-bottom:3px solid #000;
}

nav a{
    min-height:52px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:5px;

    background:
        linear-gradient(
            #fff,
            #d8d8d8 45%,
            #777 47%,
            #111 52%,
            #000
        );

    border:1px solid #fff;

    box-shadow:
        inset 0 0 0 1px #000;

    transition:.15s;
}

nav a:hover{
    transform:translateY(-3px);

    filter:brightness(1.4);

    box-shadow:
        0 0 15px rgba(255,255,255,.8);
}

nav img{
    max-width:100%;
    max-height:40px;

    object-fit:contain;
}

/* =========================================================
   MARQUEE
   ========================================================= */

.marquee{
    height:30px;

    overflow:hidden;
    white-space:nowrap;

    background:#fff;
    color:#000;

    border-bottom:3px solid #000;

    display:flex;
    align-items:center;
}

.marquee span{
    display:inline-block;

    font-size:9px;
    font-weight:bold;

    letter-spacing:3px;

    animation:
        marquee 20s linear infinite;
}

@keyframes marquee{

    from{
        transform:translateX(100%);
    }

    to{
        transform:translateX(-100%);
    }

}

/* =========================================================
   MAIN
   ========================================================= */

main{
    padding:18px;
}

/* =========================================================
   HOME
   ========================================================= */

.home{
    position:relative;

    min-height:600px;

    overflow:hidden;

    border:3px solid #000;

    background:
        linear-gradient(
            rgba(255,255,255,.55),
            rgba(255,255,255,.55)
        ),
        url("fundo.jpg");

    background-size:cover;
    background-position:center;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    box-shadow:8px 8px 0 #000;
}

.home-content{
    position:relative;

    z-index:5;

    padding:40px;
}

.home-logo{
    width:min(430px,80vw);

    filter:
        drop-shadow(0 0 8px #fff)
        drop-shadow(7px 7px 0 #000);
}

.home h1{
    margin:15px 0 0;

    font-size:
        clamp(50px,9vw,105px);

    line-height:.9;

    font-weight:900;

    letter-spacing:-5px;

    text-shadow:
        5px 5px 0 #fff,
        9px 9px 0 #000;
}

.home-sub{
    margin-top:25px;

    font-size:12px;

    font-weight:bold;

    letter-spacing:5px;
}

/* DECORAÇÕES */

.deco{
    position:absolute;

    object-fit:contain;

    z-index:2;

    pointer-events:none;

    filter:
        drop-shadow(0 0 5px #fff);
}

.bitches{
    width:220px;

    left:20px;
    bottom:15px;
}

.bears{
    width:150px;

    right:25px;
    bottom:15px;
}

.phone{
    width:150px;

    right:35px;
    top:25px;
}

.star1{
    width:75px;

    left:40px;
    top:35px;
}

.star2{
    width:100px;

    right:190px;
    bottom:110px;
}

.diva{
    width:135px;

    left:150px;
    top:30px;
}

.camera{
    width:125px;

    right:170px;
    top:80px;
}

.heart{
    width:90px;

    left:260px;
    bottom:45px;
}

/* =========================================================
   BOXES
   ========================================================= */

.box{
    margin-top:35px;

    padding:25px;

    background:rgba(255,255,255,.96);

    border:3px solid #000;

    box-shadow:8px 8px 0 #000;
}

/* =========================================================
   TITLES
   ========================================================= */

.title{
    display:flex;

    align-items:center;

    gap:15px;

    margin-bottom:25px;
}

.title-image{
    height:55px;
    max-width:260px;

    object-fit:contain;
}

.title-line{
    flex:1;

    height:3px;

    background:#000;
}

/* =========================================================
   MEMBERS
   ========================================================= */

.members{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:15px;
}

.member{
    border:3px solid #000;

    background:#fff;

    padding:8px;

    transition:.2s;
}

.member:hover{
    transform:translateY(-6px);

    box-shadow:6px 6px 0 #000;
}

.member-photo{
    width:100%;

    aspect-ratio:1/1;

    overflow:hidden;

    border:2px solid #000;
}

.member-photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.member-name{
    text-align:center;

    font-size:15px;

    font-weight:900;

    letter-spacing:2px;

    padding:12px 4px 5px;
}

.member-number{
    text-align:center;

    font-size:8px;

    letter-spacing:2px;

    padding-bottom:8px;
}

/* =========================================================
   ÁLBUM
   ========================================================= */

.album-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:35px;

    align-items:center;
}

.album-cover{
    max-width:480px;

    margin:auto;

    border:4px solid #000;

    box-shadow:9px 9px 0 #000;

    overflow:hidden;
}

.album-cover img{
    width:100%;

    display:block;
}

.album-info h3{
    margin:0;

    font-size:38px;

    letter-spacing:4px;
}

.album-info p{
    font-size:13px;

    line-height:1.8;
}

.tracklist{
    margin-top:25px;

    border-top:3px solid #000;
}

.track{
    display:flex;

    justify-content:space-between;

    gap:10px;

    padding:13px 5px;

    border-bottom:1px dotted #000;

    font-size:11px;

    font-weight:bold;
}

/* =========================================================
   M/V
   ========================================================= */

.mv-title-image{
    width:180px;
}

.mv{
    width:100%;

    aspect-ratio:16/9;

    border:4px solid #000;

    background:#000;
}

.mv iframe{
    width:100%;
    height:100%;

    border:0;
}

.mv-info{
    margin-top:20px;

    font-size:12px;

    line-height:1.7;
}

/* =========================================================
   GALLERY
   ========================================================= */

.gallery{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.gallery-item{
    border:3px solid #000;

    background:#000;

    overflow:hidden;

    aspect-ratio:1/1;
}

.gallery-item img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:.3s;
}

.gallery-item:hover img{
    transform:scale(1.08);
}

/* =========================================================
   PROJECT
   ========================================================= */

.project-grid{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:25px;

    align-items:center;
}

.project-image{
    border:3px solid #000;

    overflow:hidden;

    background:#000;
}

.project-image img{
    width:100%;

    display:block;
}

.project-text{
    font-size:13px;

    line-height:1.8;
}

/* =========================================================
   NOW PLAYING
   ========================================================= */

.now-playing{
    background:
        linear-gradient(
            135deg,
            #fff,
            #d8d8d8
        );
}

.player-layout{
    display:grid;

    grid-template-columns:
        1.2fr 1fr;

    gap:25px;

    align-items:center;
}

/* PALCO DO CD */

.cd-stage{
    position:relative;

    width:100%;

    height:380px;

    overflow:hidden;
}

/* CD */

.cd{
    position:absolute;

    width:330px;
    height:330px;

    object-fit:contain;

    top:25px;

    left:48%;

    z-index:1;

    animation:
        spin 7s linear infinite;
}

/* CAPA */

.cd-cover{
    position:absolute;

    width:330px;
    height:330px;

    object-fit:cover;

    top:25px;

    left:15%;

    z-index:3;

    border:4px solid #000;

    box-shadow:
        8px 8px 0 rgba(0,0,0,.35);
}

/*
   A capa fica na frente.
   O CD fica atrás e aparece para
   o lado direito.
*/

@keyframes spin{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

/* PLAYER INFO */

.player-info{
    border:3px solid #000;

    padding:25px;

    background:#fff;
}

.now-label{
    font-size:9px;

    font-weight:bold;

    letter-spacing:4px;
}

.song-title{
    font-size:34px;

    font-weight:900;

    margin:12px 0;

    letter-spacing:3px;
}

.song-artist{
    font-size:12px;

    margin-bottom:20px;
}

audio{
    width:100%;
}

/* =========================================================
   CREDITS
   ========================================================= */

.credits-top{
    text-align:center;

    margin-bottom:25px;
}

.credits-top img{
    width:230px;

    max-width:70%;
}

.credit-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.credit{
    border:2px solid #000;

    padding:18px;

    background:#fff;

    font-size:12px;
}

.credit strong{
    display:block;

    font-size:9px;

    letter-spacing:3px;

    margin-bottom:8px;
}

/* =========================================================
   LINKS
   ========================================================= */

.links-grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.site-link{
    display:flex;

    min-height:100px;

    align-items:center;
    justify-content:center;

    padding:15px;

    border:3px solid #000;

    background:#fff;

    transition:.2s;
}

.site-link:hover{
    background:#000;

    transform:translateY(-5px);

    box-shadow:5px 5px 0 #888;
}

.site-link img{
    max-width:85%;
    max-height:70px;

    object-fit:contain;
}

.site-link:hover img{
    filter:invert(1);
}

/* =========================================================
   EXTRA ASSETS
   ========================================================= */

.asset-showcase{
    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:15px;

    margin-top:25px;

    padding:20px;

    border:2px dashed #000;
}

.asset-showcase img{
    max-width:130px;
    max-height:100px;

    object-fit:contain;
}

/* =========================================================
   FOOTER
   ========================================================= */

footer{
    margin-top:45px;

    padding:35px 15px;

    background:#000;

    color:#fff;

    text-align:center;

    font-size:9px;

    letter-spacing:3px;

    line-height:2;
}

/* =========================================================
   RESPONSIVO
   ========================================================= */

@media(max-width:900px){

    nav{
        grid-template-columns:
            repeat(3,1fr);
    }

    .members{
        grid-template-columns:
            repeat(2,1fr);
    }

    .album-grid,
    .project-grid,
    .player-layout{
        grid-template-columns:1fr;
    }

    .gallery{
        grid-template-columns:
            repeat(2,1fr);
    }

    .links-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .site{
        width:calc(100% - 12px);
    }

    main{
        padding:10px;
    }

    .box{
        padding:15px;

        box-shadow:5px 5px 0 #000;
    }

    .header-inner{
        flex-direction:column;
    }

    .header-logo{
        max-width:70%;
    }

    nav{
        grid-template-columns:
            repeat(3,1fr);
    }

    nav a{
        min-height:45px;
    }

    nav img{
        max-height:32px;
    }

    .home{
        min-height:500px;
    }

    .home-content{
        padding:20px;
    }

    .home h1{
        font-size:58px;
    }

    .deco{
        opacity:.55;
    }

    .bitches{
        width:130px;
    }

    .bears{
        width:100px;
    }

    .phone{
        width:100px;
    }

    .diva{
        width:90px;
    }

    .camera{
        width:85px;
    }

    .cd-stage{
        height:280px;
    }

    .cd,
    .cd-cover{
        width:240px;
        height:240px;
    }

    .cd{
        left:45%;
    }

    .cd-cover{
        left:2%;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .links-grid{
        grid-template-columns:1fr;
    }

    .credit-grid{
        grid-template-columns:1fr;
    }

}

</style>

</head>
